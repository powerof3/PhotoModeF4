name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: '3.0.3'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: "windows-msvc-md-${{ hashFiles('.gitmodules', 'xmake.lua') }}"
      - name: Restore dependency cache
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/AppData/Local/.xmake/packages
            ~/AppData/Local/.xmake/cache/packages
          key: photomode-windows-x64-md-xmake303-v1-${{ hashFiles('xmake.lua', 'scripts/dependency_sources.json') }}
      - name: Toolchain and dependency identities
        run: |
          xmake --version
          cl 2>&1 | Out-Host
          python --version
          cmake --version
          git submodule status --recursive
      - name: Portable regression checks
        run: |
          python -m unittest discover -s tests -v
          cl /nologo /std:c++latest /EHsc /Iinclude tests/math_tests.cpp /Fe:math_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./math_tests.exe
      - name: Configure
        run: xmake f -p windows -a x64 -m releasedbg --toolchain=msvc -y -vD
      - name: Compile and link
        run: xmake -y -vD
      - name: Verify and package
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter po3_PhotoModeF4.dll | Select-Object -First 1
          $pdb = Get-ChildItem build -Recurse -Filter po3_PhotoModeF4.pdb | Select-Object -First 1
          if (!$dll -or !$pdb) { throw 'Missing Photo Mode DLL or PDB' }
          $exports = & dumpbin /exports $dll.FullName
          $exports | Out-Host
          foreach ($symbol in @('F4SEPlugin_Load', 'F4SEPlugin_Version')) {
            if (!($exports -match $symbol)) { throw "Missing export $symbol" }
          }
          python scripts/package_release.py --dll $dll.FullName --pdb $pdb.FullName --output dist --source-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item xmake-requires.lock dist/ -ErrorAction Stop
      - name: Collect source diagnostics
        if: failure()
        run: |
          xmake project -k compile_commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_translation_units.py
      - name: Build diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Get-Command xmake -ErrorAction SilentlyContinue) { xmake show -l targets }
          Get-ChildItem .xmake -Recurse -Filter '*.log' | ForEach-Object { Get-Content $_.FullName -Tail 150 }
      - name: Save dependency cache
        if: always() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/AppData/Local/.xmake/packages
            ~/AppData/Local/.xmake/cache/packages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Preserve dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lock
          path: xmake-requires.lock
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PhotoModeF4-1.11.240
          path: dist/*
          if-no-files-found: error
